# Apply after node-class.yaml: kubectl apply -f node-pool.yaml
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]     # spot-first for Java microservices
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]           # compute/general/memory — good for JVM
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["3"]                     # nothing older than gen 4
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "medium"]

  limits:
    cpu: 1000
    memory: 2000Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
