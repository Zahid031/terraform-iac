# Apply after Helm install: kubectl apply -f node-class.yaml
# The role field must be the node IAM role NAME (not ARN).
# Get it: terraform -chdir=environments/prod/eks output node_role_name
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "rideshare-prod-eks-node-role"

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rideshare-prod-eks"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rideshare-prod-eks"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true

  metadataOptions:
    httpTokens: required          # IMDSv2 enforced
    httpPutResponseHopLimit: 1
