apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: rideshare-prod-eks-karpenter-node

  # REQUIRED in v1.13
  amiFamily: AL2023

  # REQUIRED (THIS WAS MISSING IN YOUR FILE)
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rideshare-prod-eks"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rideshare-prod-eks"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1

  tags:
    Project: "rideshare"
    Environment: "prod"
    ManagedBy: "karpenter"