# environments/prod/karpenter/node-pool.yaml
#
# Apply after node-class.yaml:
#   kubectl apply -f node-pool.yaml

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        role: "app"

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        # amd64 only — Java images compiled for x86
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # Spot-first; Karpenter falls back to on-demand automatically
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # c = compute, m = general purpose, r = memory — all good for JVM
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        # Gen 4+ only
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["3"]

        # Nothing smaller than large — Java services need headroom
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "medium"]

        # Spread across all 3 AZs for HA and spot availability
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - "ap-southeast-1a"
            - "ap-southeast-1b"
            - "ap-southeast-1c"

  limits:
    cpu: 1000
    memory: 2000Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
