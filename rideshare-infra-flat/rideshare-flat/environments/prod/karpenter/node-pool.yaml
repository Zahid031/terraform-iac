# environments/prod/karpenter/node-pool.yaml
#
# Apply after node-class.yaml:
#   kubectl apply -f node-pool.yaml
#
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        role: "app"

    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        # amd64 only — your Java images are compiled for x86
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # Spot-first for cost savings; Karpenter falls back to on-demand
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # c = compute optimised, m = general purpose, r = memory optimised
        # All good for JVM workloads — wide selection helps spot availability
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        # Gen 4+ only — no old hardware
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["3"]

        # Minimum t-shirt size — your Java services need headroom
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small", "medium"]

        # Spread across all 3 AZs for HA and spot availability
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - "ap-southeast-1a"
            - "ap-southeast-1b"
            - "ap-southeast-1c"

      # App nodes must NOT carry the system taint
      # This ensures system pods never leak onto Karpenter nodes
      # and Karpenter never provisions nodes that system pods could land on
      taints: []

  limits:
    cpu: 1000
    memory: 2000Gi

  disruption:
    # Consolidate underutilised nodes aggressively — good for cost
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

    # Respect PodDisruptionBudgets during consolidation
    budgets:
      - nodes: "10%"         # never disrupt more than 10% of nodes at once
