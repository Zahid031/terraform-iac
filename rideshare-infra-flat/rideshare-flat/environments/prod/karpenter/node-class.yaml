# environments/prod/karpenter/node-class.yaml
#
# Apply after Helm install:
#   kubectl apply -f node-class.yaml
#
# The role field must be the node IAM role NAME (not ARN).
# Get it: terraform -chdir=environments/prod/eks output -raw node_role_name
#
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Node IAM role name — NOT the ARN
  # Get from: terraform -chdir=environments/prod/eks output -raw node_role_name
  role: "rideshare-prod-eks-system"

  amiFamily: AL2023

  # Karpenter discovers subnets via the karpenter.sh/discovery tag
  # Your private-app subnets must carry this tag (set in your VPC module)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rideshare-prod-eks"

  # Karpenter discovers SGs via the karpenter.sh/discovery tag
  # Your eks-nodes SG carries this tag (set in security-groups module)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "rideshare-prod-eks"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  metadataOptions:
    httpTokens: required          # enforce IMDSv2
    httpPutResponseHopLimit: 1    # block pod metadata access

  tags:
    Project:     "rideshare"
    Environment: "prod"
    ManagedBy:   "karpenter"
